#
# Node1: OTel Collector + File-based Trace Storage
# This receives telemetry from node0 and writes traces to files.

x-default-logging: &logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "2"
    tag: "{{.Name}}"

networks:
  default:
    name: opentelemetry-demo
    driver: bridge

services:
  # OpenTelemetry Collector
  otel-collector:
    image: ${COLLECTOR_CONTRIB_IMAGE}
    container_name: otel-collector
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped
    command: [ "--config=/etc/otelcol-config.yml" ]
    user: 0:0
    volumes:
      - ${HOST_FILESYSTEM}:/hostfs:ro
      - ${DOCKER_SOCK}:/var/run/docker.sock:ro
      - ./src/otel-collector/otelcol-config-cloudlab.yml:/etc/otelcol-config.yml
      - /data/otel:/data/otel
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    logging: *logging
    environment:
      - HOST_FILESYSTEM
      - OTEL_COLLECTOR_HOST=0.0.0.0
      - OTEL_COLLECTOR_PORT_GRPC=4317
      - OTEL_COLLECTOR_PORT_HTTP=4318
      - PROMETHEUS_HOST=10.10.1.3
      - PROMETHEUS_PORT=9090
      - GOMEMLIMIT=900MiB
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started

  # Tempo for trace storage and visualization
  tempo:
    image: ${TEMPO_IMAGE}
    container_name: tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    user: "0:0"  # Run as root to avoid permission issues
    volumes:
      - ./src/tempo/tempo-config.yaml:/etc/tempo.yaml
      - /data/tempo:/var/tempo
    deploy:
      resources:
        limits:
          memory: 1200M
    restart: unless-stopped
    ports:
      - "3200:3200"   # tempo http
      - "4320:4317"   # otlp grpc (different port to avoid conflict with collector)
    logging: *logging

  # Loki for log storage (Grafana Logs Drilldown)
  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    user: "0:0"
    volumes:
      - ./src/loki/loki-config.yaml:/etc/loki/local-config.yaml
      - /data/loki:/loki
    deploy:
      resources:
        limits:
          memory: 800M
    restart: unless-stopped
    ports:
      - "3100:3100"   # Loki HTTP
    logging: *logging
