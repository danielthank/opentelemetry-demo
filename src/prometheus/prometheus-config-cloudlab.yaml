# CloudLab Prometheus Configuration
# Receives OTLP metrics from the collector on node1

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# OTLP receiver is enabled via command line flags:
# --web.enable-otlp-receiver

scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape OTel Collector on node1
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['10.10.1.2:8888']
        labels:
          node: 'node1'

  # Scrape node exporters if installed
  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - '10.10.1.1:9100'
          - '10.10.1.2:9100'
          - '10.10.1.3:9100'
        labels:
          cluster: 'cloudlab'
